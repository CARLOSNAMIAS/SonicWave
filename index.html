<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://sonicwave-radio.vercel.app/" />
    <title>SonicWave AI Radio</title>

    <!-- Social Media Cards -->
    <meta
      name="description"
      content="SonicWave AI Radio: Tu portal gratuito a más de 30,000 emisoras de radio globales. Descubre música nueva con nuestro DJ impulsado por IA y disfruta de una experiencia auditiva visualmente inmersiva."
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sonicwave-radio.vercel.app/" />
    <meta property="og:title" content="SonicWave AI Radio" />
    <meta
      property="og:description"
      content="Descubre estaciones de radio de todo el mundo con el poder de la IA. Tu música, a tu manera."
    />
    <meta
      property="og:image"
      content="https://sonicwave-radio.vercel.app/compartir.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://sonicwave-radio.vercel.app/"
    />
    <meta property="twitter:title" content="SonicWave AI Radio" />
    <meta
      property="twitter:description"
      content="Descubre estaciones de radio de todo el mundo con el poder de la IA. Tu música, a tu manera."
    />
    <meta
      property="twitter:image"
      content="https://sonicwave-radio.vercel.app/compartir.png"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/faviconn.png" />
    <link rel="apple-touch-icon" href="/faviconn.png" />

    <!-- Tipografía: Archivo (grotesca variable, eje de anchura) + IBM Plex Mono (datos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Sólo lo imprescindible antes de que cargue el CSS de la aplicación:
         el fondo de la página y la pantalla de carga. El resto vive en
         src/index.css, compilado junto con Tailwind. */
      html {
        background-color: #e9e6df;
      }
      html.dark {
        background-color: #000;
      }

      /* --- Pantalla de carga --------------------------------------------- */
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 24px;
        background-color: #000;
        color: #e9e6df;
        transition: opacity 0.5s ease-out;
      }

      #initial-splash .splash-word {
        font-family: "Archivo", system-ui, sans-serif;
        font-variation-settings: "wdth" 68, "wght" 900;
        text-transform: uppercase;
        letter-spacing: -0.03em;
        line-height: 0.8;
        font-size: clamp(3.5rem, 22vw, 14rem);
      }

      #initial-splash .splash-meta {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8c8880;
      }

      #initial-splash .splash-bar {
        height: 3px;
        background: rgb(255 59 0);
        width: 0;
        animation: splashTune 2.4s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      @keyframes splashTune {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "react/": "https://esm.sh/react@^19.2.3/",
          "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
          "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
        }
      }
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6983431049380018"
      crossorigin="anonymous"
    ></script>
  </head>
  <!-- El color de fondo vive en <html> para que el espectro de fondo (canvas en
       z-index negativo) quede por encima de él y por debajo del contenido. -->
  <body class="text-ink dark:text-paper">
    <!-- Pantalla de carga -->
    <div id="initial-splash">
      <div class="splash-meta" style="display: flex; justify-content: space-between; margin-bottom: 16px">
        <span>Radio mundial</span>
        <span>Sintonizando</span>
      </div>
      <div class="splash-bar"></div>
      <h1 class="splash-word" style="margin-top: 24px">
        Sonic<br />Wave
      </h1>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>

    <!-- Script de analíticas (Simple Analytics) -->
    <script
      async
      src="https://scripts.simpleanalyticscdn.com/latest.js"
    ></script>
  </body>
</html>
